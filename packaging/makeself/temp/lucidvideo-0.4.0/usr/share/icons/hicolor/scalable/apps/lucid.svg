<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  
  <!-- Film frame / video icon -->
  <rect x="52" y="52" width="152" height="100" rx="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Film perforations left -->
  <rect x="58" y="60" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="58" y="82" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="58" y="104" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="58" y="126" width="16" height="12" rx="3" fill="#6366f1"/>
  
  <!-- Film perforations right -->
  <rect x="182" y="60" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="182" y="82" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="182" y="104" width="16" height="12" rx="3" fill="#6366f1"/>
  <rect x="182" y="126" width="16" height="12" rx="3" fill="#6366f1"/>
  
  <!-- Play button / AI sparkle -->
  <polygon points="110,78 110,126 150,102" fill="url(#accent)"/>
  
  <!-- AI sparkle / star accent -->
  <circle cx="180" cy="68" r="6" fill="#fbbf24"/>
  <circle cx="190" cy="78" r="4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="175" cy="82" r="3" fill="#fbbf24" opacity="0.5"/>
  
  <!-- Neural network dots representing AI -->
  <circle cx="76" cy="168" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="110" cy="180" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="146" cy="168" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="180" cy="180" r="8" fill="#ffffff" opacity="0.9"/>
  
  <!-- Connection lines -->
  <line x1="84" y1="168" x2="104" y2="178" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="116" y1="180" x2="140" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="152" y1="168" x2="172" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  
  <!-- Bottom accent bar -->
  <rect x="96" y="200" width="64" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
</svg>
